/* --- SHMOT312 NIGHTSHIFT DESIGN SYSTEM --- */
/* SHMOT312 • NIGHTSHIFT / dark neon system
   Keep this after the original styles. No external CSS libraries are required. */
:root {
  color-scheme: dark;
  --bg: #07090f;
  --panel: #121724;
  --ink: #f4f6ff;
  --muted: #94a0b7;
  --line: #272e40;
  --black: #0c101b;
  --lime: #c5fb5a;
  --lav: #271d48;
  --purple: #ad92ff;
  --shadow: 0 16px 52px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.025);
  --radius: 20px;
  --cyan:#66cbff;
  --pink:#ff7ca7;
  --violet:#a88aff;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse 660px 540px at 45% -260px, rgba(112,77,235,.18),transparent 82%),
    radial-gradient(ellipse 450px 370px at 96% 22%,rgba(78,127,255,.07),transparent 80%),
    #07090f;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(190,245,97,.4);color:white}
::-webkit-scrollbar{width:10px;height:9px}
::-webkit-scrollbar-track{background:#0c1018}
::-webkit-scrollbar-thumb{border-radius:10px;background:#323c52;border:2px solid #0c1018}
.sidebar{
  background:linear-gradient(167deg,#111525 0%,#0b0e18 52%,#0a0d14 100%);
  border-right:1px solid #293249;
  box-shadow:10px 0 50px rgba(0,0,0,.15);
}
.sidebar:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,#805bff 2%,#54bcff 52%,#c5fb5a 98%)}
.logo{font-size:25px;letter-spacing:-1.4px;text-shadow:0 0 25px #a888ff24}
.logo span{filter:drop-shadow(0 0 10px #d4ff5e44)}
.brand-under{color:#818ba9;letter-spacing:2.7px}
.side-caption{color:#6c7998;font-size:10px;letter-spacing:1.6px}
.nav{gap:7px}
.nav-btn{border:1px solid transparent;color:#a4aec8;border-radius:12px;font-size:12.5px;padding:12px 13px;transition:background .2s,border-color .2s,transform .2s,color .2s}
.nav-btn:hover{background:rgba(127,114,243,.12);color:#fff;border-color:rgba(151,145,255,.16);transform:translateX(2px)}
.nav-btn.active{color:#f4f3ff;background:linear-gradient(105deg,#5944b1 0%,#302956 72%,#22243a 100%);border-color:#8066da7d;box-shadow:0 5px 22px #7d5beb21,inset 3px 0 0 #c4fb59}
.nav-btn.active .nav-icon{color:#d2fc77}
.nav-btn small{background:#272d43;color:#b7bfd5}
.nav-btn.active small{background:#d0fa73;color:#171d22}
.nav-icon{font-size:18px;color:#858dad}
.brand-link{background:linear-gradient(105deg,rgba(83,62,170,.2),rgba(173,247,92,.045));border-color:#48506b;color:#dcfba4;padding:13px 15px}
.brand-link:hover{background:#252a3e;border-color:var(--lime)}
.sidebar-bottom{background:linear-gradient(135deg,#1c2234,#151a28);border:1px solid #303a50;border-radius:15px}
.sidebar-bottom p{color:#8793b0}
.sidebar-bottom button{color:#dfe6fb;border:1px solid #4b5370}
.sidebar-bottom button:hover{background:#30394c}
.online-dot{box-shadow:0 0 0 4px #c5fb5a12,0 0 15px #c5fb5a90}
.topbar{
  background:rgba(12,16,26,.88);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid #292f44;
  min-height:79px;
  position:sticky;top:0;z-index:11;
}
.crumb{color:#8897b4}

/* Interactive Kanban: four clear destinations, drag-feedback, and touch/keyboard controls. */
.workcol{transition:border-color .2s,background .2s,box-shadow .2s;position:relative}
.board-column-title{display:flex;gap:8px;align-items:center;justify-content:space-between}
.board-column-title h2{margin:0;min-width:0}
.board-count{display:grid;place-items:center;flex:none;padding:4px 9px;min-width:28px;border-radius:9px;background:#ffffff12;color:#d8e5ff;border:1px solid #ffffff24;font-size:12px;font-weight:800}
.board-help{display:flex;align-items:center;gap:12px;padding:14px 17px;margin:16px 0 19px;border:1px solid #3b4570;background:linear-gradient(100deg,#252041,#131c2e);border-radius:14px;color:#b7c8eb;font-size:12px}
.board-help strong{color:#eef4ff}
.board-help-icon{display:grid;place-items:center;background:#855af130;border-radius:11px;width:35px;height:35px;flex:none;color:#beaeff;font-size:22px}
.workcard[draggable=true]{cursor:grab;user-select:none;transition:transform .17s,border-color .17s,box-shadow .17s,opacity .17s}
.workcard[draggable=true]:hover{border-color:#717fba;transform:translateY(-2px);box-shadow:0 12px 30px #03071065}
.workcard.is-dragging{cursor:grabbing;opacity:.35;transform:scale(.98)}
.workcol.is-drop-target{border:2px dashed #c3fa70!important;background:linear-gradient(180deg,#25342a,#121d28);box-shadow:0 0 0 3px #c8ff551d,inset 0 0 35px #c1ff4a14}
.workcol.is-drop-target .board-drop-hint{opacity:1;transform:translateY(0)}
.workcol.is-drop-target .board-empty{color:#b9fa6b}
.board-grip{margin-left:auto;color:#9eacd7;font-size:22px;line-height:1;cursor:grab;letter-spacing:1px}
.workcard .wc-top .tag{font-size:10px}
.board-drop-hint{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;border:1px dashed #bafc70a0;border-radius:9px;padding:9px;text-align:center;margin-top:10px;color:#d4ffa0;font-size:11px;font-weight:700;pointer-events:none}
.move-label{display:block;color:#9faccc;font-size:10px;font-weight:750;margin-bottom:5px}
.board-move{display:block;width:100%;font-size:11px;padding:9px 11px;border:1px solid #424d69;background:#182335;color:#dfebff;border-radius:9px;margin:0 0 9px;cursor:pointer}
.board-move:hover,.board-move:focus{border-color:#ad9afa}
.board-empty{padding:44px 12px;color:#7685a5}
@media(max-width:700px){.board-help{display:none}.workcard[draggable=true]{cursor:default}.board-grip{display:none}.board-move{font-size:13px;padding:12px}.board-drop-hint{display:none}}

/* ===== SHMOT312 / ANY-FORMAT ATTACHMENTS ===== */
.file-workspace{margin-top:24px;padding:20px;border-radius:19px;background:linear-gradient(144deg,rgba(124,87,255,.095),rgba(65,185,255,.045) 55%,rgba(197,251,90,.025));border:1px solid #434168;position:relative;overflow:hidden}
.file-workspace:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,#a78bfa,#63caff,#b8fb67);opacity:.95}
.file-workspace-head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.file-head-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#defeaa;font-size:21px;background:linear-gradient(135deg,#3a276e,#182b48);border:1px solid #66609c;box-shadow:0 8px 25px #7254e42b;flex-shrink:0}

.file-drop{min-height:133px;border:1.5px dashed #677398;background:#0f1725a8;border-radius:15px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;color:#b7c2df;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;position:relative}

.file-drop .file-big{font-size:27px;line-height:1.2}.file-drop strong{color:#eaf0ff;font-size:13px}.file-drop strong em{color:#c5fb5a;font-style:normal}.file-drop small{max-width:100%;font-size:11px;color:#8694b1;line-height:1.6}

<script>
'use strict';
const KEY='closer_merch_2026_v1';
const $=(q,root=document)=>root.querySelector(q), $$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const now=()=>new Date().toISOString();
const localDay=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const ago=(days=0,hours=0)=>new Date(Date.now()-days*86400000-hours*3600000).toISOString();
const id=(prefix='ID')=>prefix+Math.random().toString(36).slice(2,8).toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n)||0)+' сом';
const date=s=>s?new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}):'—';
const dateTime=s=>s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const statuses={new:'Новая',consult:'Консультация',offer:'Предложение',mockup:'Макет',payment:'Ожидает оплату',production:'В производстве',shipping:'Отправлен',done:'Завершён',lost:'Отказ'};
const orderStatuses={draft:'Новый заказ',mockup:'На согласовании',payment:'Ожидает оплату',production:'В производстве',shipping:'Отправлен',ready:'Готов к выдаче',done:'Доставлен',cancelled:'Отменён'};
const statusColors={new:'violet',consult:'blue',offer:'yellow',mockup:'violet',payment:'yellow',production:'blue',shipping:'blue',ready:'green',done:'green',lost:'red',draft:'dark',cancelled:'red'};
const PRODUCT_EMOJI={'Футболка':'👕','Батник / свитшот':'🧥','Кепка':'🧢','Термос':'🥤'};
function initial(){
 const leads=[
 {id:'L001',name:'Алина',handle:'alina.design',phone:'',source:'instagram',status:'new',priority:'high',category:'Футболка',notes:'Интересуется оверсайз, спрашивала про ткань',nextAction:'Ответить по составу ткани',dueDate:localDay(0),createdAt:ago(0,2),lastAt:ago(0,2)},
 {id:'L002',name:'Бакыт / Optima Team',handle:'',phone:'+996700123456',source:'whatsapp',status:'mockup',priority:'high',category:'Корпоративный заказ',notes:'30 футболок с логотипом компании. Нужен макет.',nextAction:'Согласовать логотип с дизайнером',dueDate:localDay(1),createdAt:ago(2),lastAt:ago(0,7)},
 {id:'L003',name:'Эльмира',handle:'elmira.kg',phone:'',source:'instagram',status:'payment',priority:'normal',category:'Термос',notes:'Выбрала чёрный термос, отправлена сумма оплаты.',nextAction:'Напомнить об оплате',dueDate:localDay(0),createdAt:ago(1),lastAt:ago(0,10)},
 {id:'L004',name:'Нурлан',handle:'',phone:'+996555123456',source:'whatsapp',status:'done',priority:'normal',category:'Кепка',notes:'Клиент получил заказ, можно предложить новинки.',nextAction:'Предложить повторный заказ',dueDate:localDay(3),createdAt:ago(9),lastAt:ago(3)},
 {id:'L005',name:'Камила',handle:'kamila_shop',phone:'',source:'instagram',status:'consult',priority:'normal',category:'Батник / свитшот',notes:'Выбирает между S и M',nextAction:'Уточнить рост и желаемую посадку',dueDate:localDay(1),createdAt:ago(1),lastAt:ago(0,5)}
 ];
 const products=[{id:'P1',name:'Футболка',price:750,emoji:'👕',desc:'База под принт, размеры и цвета уточняются'},{id:'P2',name:'Батник / свитшот',price:1600,emoji:'🧥',desc:'Повседневная одежда, возможность нанесения'},{id:'P3',name:'Кепка',price:500,emoji:'🧢',desc:'Цвета и способ нанесения по согласованию'},{id:'P4',name:'Термос',price:850,emoji:'🥤',desc:'Корпоративные и персональные варианты'}];
 const orders=[
 {id:'M101',leadId:'L002',items:[{productId:'P1',name:'Футболка',size:'разные',color:'Белый',qty:30,base:750,print:220}],discount:5,status:'mockup',paid:0,printType:'DTF-печать',mockup:'',deadline:localDay(6),delivery:'Доставка',tracking:'',notes:'Логотип на груди. Нужно согласовать макет.',createdAt:ago(1)},
 {id:'M102',leadId:'L003',items:[{productId:'P4',name:'Термос',size:'—',color:'Чёрный',qty:1,base:850,print:0}],discount:0,status:'payment',paid:0,printType:'Без нанесения',mockup:'',deadline:localDay(3),delivery:'Самовывоз',tracking:'',notes:'Ждём оплату.',createdAt:ago(1)},
 {id:'M103',leadId:'L004',items:[{productId:'P3',name:'Кепка',size:'One Size',color:'Чёрный',qty:2,base:500,print:0}],discount:0,status:'done',paid:1000,printType:'Без нанесения',mockup:'',deadline:localDay(-3),delivery:'Курьер',tracking:'',notes:'Заказ доставлен.',createdAt:ago(9)}
 ];
 return {version:1,leads,products,orders};
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.leads)&&Array.isArray(d.orders)&&Array.isArray(d.products))return d}}catch(e){}return initial()}
let db=load(),page='dashboard',leadQuery='',leadStatus='all',leadSource='all',orderQuery='',orderStatus='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Не удалось сохранить: переполнено хранилище браузера')}};
function toast(msg){const node=$('#toast');node.textContent=msg;node.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>node.classList.remove('show'),3000)}
function getLead(id){return db.leads.find(l=>l.id===id)}
function total(o){return Math.max(0,Math.round((o.items||[]).reduce((s,x)=>s+(Number(x.base)+Number(x.print))*Number(x.qty),0)*(1-(Number(o.discount)||0)/100)))}
function opts(map,val){return Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(v)}</option>`).join('')}
function tag(key,label){return `<span class="tag ${statusColors[key]||'dark'}">${esc(label||statuses[key]||orderStatuses[key]||key)}</span>`}
function source(s){return s==='instagram'?'<span class="tag violet">◎ Instagram</span>':s==='whatsapp'?'<span class="tag green">◉ WhatsApp</span>':'<span class="tag dark">Вручную</span>'}
function fmtTemplate(t,l){const ls=l||db.leads[0];return t.replaceAll('{имя}',ls?.name||'').replaceAll('{товар}',ls?.category||'интересующий товар').replaceAll('{сумма}','[сумма]').replaceAll('{срок}','[дата]')}
function openPage(p){page=p;$('#sidebar').classList.remove('open');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const names={dashboard:'Главная',leads:'Заявки и клиенты',orders:'Заказы',production:'Производство',catalog:'Каталог и цены',calculator:'Калькулятор',scripts:'Скрипты ответов',reports:'Отчёты',settings:'Данные и настройки'};$('#bread').textContent=names[p]||'Главная';$('#navLeads').textContent=db.leads.filter(x=>x.status==='new').length;$('#content').innerHTML=({dashboard:dashboard,leads:leadsView,orders:ordersView,production:productionView,catalog:catalogView,calculator:calculatorView,scripts:scriptsView,reports:reportsView,settings:settingsView}[p]||dashboard)();window.scrollTo({top:0,behavior:'instant'});if(p==='calculator')updateQuote();}
function heading(k,title,desc,actions=''){return `<div class="title-row"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="subtext">${desc}</p></div><div class="actions">${actions}</div></div>`}
function dashboard(){
 const open=db.leads.filter(l=>!['lost','done'].includes(l.status));const newL=db.leads.filter(l=>l.status==='new').length;const activeO=db.orders.filter(o=>!['done','cancelled'].includes(o.status));const due=db.leads.filter(l=>l.dueDate&&l.dueDate<=localDay()&&!['done','lost'].includes(l.status));
 const paid=db.orders.reduce((s,o)=>s+Number(o.paid||0),0);const allStages=['new','consult','offer','mockup','payment'];const max=Math.max(1,...allStages.map(s=>db.leads.filter(l=>l.status===s).length));
 const latest=[...db.leads].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);
 return heading('SHMOT312 / менеджер','Продажи под контролем','Direct и WhatsApp → просчёт → макет → производство → доставка.',`<button class="btn outline" data-page="production">▨ Производство</button><button class="btn outline" data-action="new-order">＋ Новый заказ</button><button class="btn primary" data-action="new-lead">＋ Добавить заявку</button>`)+
 `<div class="stats"><div class="stat accent"><div class="stat-top">Заявки в работе <span class="chip">CRM</span></div><div class="num">${open.length}</div><div class="foot">${newL} новых обращений</div></div><div class="stat"><div class="stat-top">Заказы в процессе <span class="chip">Заказы</span></div><div class="num">${activeO.length}</div><div class="foot">От оформления до доставки</div></div><div class="stat"><div class="stat-top">Получено оплат <span class="chip">Итого</span></div><div class="num">${fmt(paid)}</div><div class="foot">Сумма по всем заказам в базе</div></div><div class="stat"><div class="stat-top">Требуют внимания <span class="chip">Сегодня</span></div><div class="num">${due.length}</div><div class="foot">Просроченные и сегодняшние задачи</div></div></div>`+
 `<div class="two-col"><section class="panel"><div class="panel-head"><h2>Последние обращения</h2><button class="text-link" data-page="leads">Все заявки ↗</button></div>${latest.map((l,i)=>`<div class="inbox-line"><div class="person-icon ${i%3===1?'green':i%3===2?'orange':''}">${esc(l.name.trim().slice(0,2).toUpperCase())}</div><div class="person-content"><div class="person-name">${esc(l.name)} ${l.priority==='high'?'<span style="color:#dd7b53;font-size:10px">● горячая</span>':''}</div><div class="person-detail">${esc(l.category||'Без товара')} • ${dateTime(l.createdAt)}</div></div><div class="inbox-actions">${tag(l.status)}<button class="btn sm outline" data-edit-lead="${l.id}">Открыть</button></div></div>`).join('')||'<div class="empty">Пока нет заявок</div>'}</section><section class="panel"><div class="panel-head"><h2>Ближайшие действия</h2><span class="tag ${due.length?'yellow':'green'}">${due.length} срочных</span></div>${db.leads.filter(l=>l.nextAction&&l.dueDate&&!['lost','done'].includes(l.status)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,6).map(l=>`<div class="task"><span class="task-dot ${l.dueDate<localDay()?'red':l.dueDate===localDay()?'':'green'}"></span><div><strong>${esc(l.nextAction)}</strong><small>${esc(l.name)} • ${l.dueDate===localDay()?'Сегодня':l.dueDate<localDay()?'Просрочено':date(l.dueDate)}</small></div><button class="btn sm light" data-edit-lead="${l.id}">→</button></div>`).join('')||'<div class="empty">Нет запланированных задач. Отличная работа!</div>'}</section></div>`+
 `<section class="panel"><div class="panel-head"><h2>Воронка продаж</h2><button class="text-link" data-page="leads">Перейти к клиентам ↗</button></div><div class="pipeline">${allStages.map(s=>{const n=db.leads.filter(l=>l.status===s).length;return `<div class="pipe-step"><small>${statuses[s]}</small><strong>${n}</strong><small>клиентов</small><div class="pipe-bar"><span style="width:${Math.round(n/max*100)}%"></span></div></div>`}).join('')}</div></section>`+
 `<div class="print-note">Демо-данные и цены вымышлены. Это личный помощник менеджера, не официальный сервис SHMOT312; доступ к Instagram и WhatsApp не подключён.</div>`;
}
function leadsView(){let ls=[...db.leads].filter(l=>(leadStatus==='all'||l.status===leadStatus)&&(leadSource==='all'||l.source===leadSource)&&[l.name,l.handle,l.phone,l.category,l.company,l.campaign,l.notes].join(' ').toLowerCase().includes(leadQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return heading('SHMOT312 / обращения','Заявки и клиенты','Лиды из рекламы, корпоративные клиенты и повторные обращения.',`<button class="btn outline" data-action="export-leads">↓ CSV для Google Таблиц</button><button class="btn primary" data-action="new-lead">＋ Новая заявка</button>`)+`<section class="panel"><div class="filters"><input class="field filter-search" id="leadSearch" placeholder="Поиск по имени, товару, телефону…" value="${esc(leadQuery)}"><select id="leadStatusFilter"><option value="all">Все этапы</option>${opts(statuses,leadStatus)}</select><select id="leadSourceFilter"><option value="all">Все каналы</option>${opts({instagram:'Instagram',whatsapp:'WhatsApp',manual:'Вручную'},leadSource)}</select><span class="mini" id="leadCount">${ls.length} заявок</span></div><div id="leadsTable">${leadsTable(ls)}</div></section>`}
function leadsTable(ls){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Клиент</th><th>Источник</th><th>Интерес / товар</th><th>Этап</th><th>Следующее действие</th><th>Связаться</th><th></th></tr></thead><tbody>${ls.map(l=>`<tr><td><strong>${esc(l.name)}</strong>${safeAttachments(l.attachments).length?`<span class="file-mini">📎 ${safeAttachments(l.attachments).length}</span>`:""}<small>${esc(l.handle?'@'+l.handle:l.phone||'Контакт не указан')}</small></td><td>${source(l.source)}</td><td>${esc(l.category||'—')}${l.company?`<small>🏢 ${esc(l.company)}</small>`:''}</td><td><select data-status-lead="${l.id}" aria-label="Этап клиента">${opts(statuses,l.status)}</select></td><td>${esc(l.nextAction||'—')}<small>${date(l.dueDate)}</small></td><td><div class="quick-links">${contactLinks(l)}</div></td><td><button class="linkish" data-edit-lead="${l.id}">Карточка →</button></td></tr>`).join('')}</tbody></table>${ls.length?'':'<div class="empty">Заявок по этим фильтрам нет</div>'}</div>`}
function contactLinks(l){let a=[];let digits=(l.phone||'').replace(/\D/g,'');if(digits)a.push(`<a href="https://wa.me/${digits}" target="_blank" rel="noopener noreferrer">WA ↗</a>`);if(l.handle)a.push(`<a href="https://www.instagram.com/${encodeURIComponent(l.handle.replace('@',''))}/" target="_blank" rel="noopener noreferrer">IG ↗</a>`);return a.join('')||'<span class="mini">—</span>'}

const MOCKUP_STAGES={not_sent:'Не отправлен',waiting:'Ожидает согласования',revision:'Правки',approved:'Утверждён'};
const PRODUCTION_STAGES={not_started:'Не передан в цех',queued:'Очередь',printing:'Изготовление',qc:'Контроль качества',ready:'Готов'};
// Every active order belongs to exactly one board column. Other order details remain unchanged.
const BOARD_STAGES=[
 {key:'mockup',title:'01 / Заявка и макет',caption:'Нужно уточнить ТЗ или согласовать макет'},
 {key:'payment',title:'02 / Ждём оплату',caption:'Заказы на этапе оплаты'},
 {key:'production',title:'03 / Производство',caption:'Принятые в работу и изготовление'},
 {key:'shipping',title:'04 / К выдаче и доставке',caption:'Готово к передаче или уже отправлено'}
];
function boardStage(o){
 if(o.status==='shipping'||o.status==='ready'||o.status==='done')return 'shipping';
 if(o.status==='payment')return 'payment';
 if(o.status==='production')return (o.productionStage==='ready'?'shipping':'production');
 return 'mockup';
}
function moveOrderToStage(orderId,stage){
 const o=db.orders.find(x=>x.id===orderId);
 const col=BOARD_STAGES.find(x=>x.key===stage);
 if(!o||!col||o.status==='cancelled'||o.status==='done')return;
 if(boardStage(o)===stage)return;
 // Dragging changes the order's workflow stage, never its paid amount or client's approval.
 if(stage==='mockup'){o.status='mockup';o.productionStage='not_started'}
 else if(stage==='payment'){o.status='payment'}
 else if(stage==='production'){o.status='production';if(!o.productionStage||o.productionStage==='not_started'||o.productionStage==='ready')o.productionStage='queued'}
 else if(stage==='shipping'){o.status='ready';o.productionStage='ready'}
 refresh();
 toast('Заказ #'+o.id+' → '+col.title.replace(/^\d+ \/ /,'')+'. Этап сохранён.');
}
function productionView(){
 const orders=db.orders.filter(o=>!['done','cancelled'].includes(o.status));
 const late=orders.filter(o=>o.deadline&&o.deadline<localDay());
 return heading('SHMOT312 / контроль сроков','Производство','Перетаскивай карточки между этапами. На телефоне используй «Переместить в…».',`<button class="btn primary" data-action="new-order">＋ Новый заказ</button>`)+
 `<div class="notice warn"><strong>Важно:</strong> перенос изменяет этап заказа в CRM, но не подтверждает оплату или согласование макета с клиентом. С реальным цехом автоматической синхронизации нет.</div>`+
 `<div class="stats"><div class="stat"><div class="stat-top">Активных заказов</div><div class="num">${orders.length}</div><div class="foot">Без завершённых и отменённых</div></div><div class="stat"><div class="stat-top">Ждут макет</div><div class="num">${orders.filter(o=>o.printType!=='Без нанесения'&&(o.mockupStatus||'not_sent')!=='approved').length}</div><div class="foot">Нужна проверка или согласование</div></div><div class="stat"><div class="stat-top">Просрочен срок</div><div class="num">${late.length}</div><div class="foot">По назначенной дате изготовления</div></div><div class="stat accent"><div class="stat-top">Осталось оплатить</div><div class="num">${fmt(orders.reduce((a,o)=>a+Math.max(0,total(o)-Number(o.paid||0)),0))}</div><div class="foot">По активным заказам</div></div></div>`+
 `<div class="board-help"><span class="board-help-icon">↔</span><span><strong>Управляй заказами прямо на доске.</strong> Захвати карточку мышкой и брось в нужную колонку — изменение сохранится автоматически.</span></div>`+
 `<div class="workboard" aria-label="Доска заказов с перемещением между этапами">${BOARD_STAGES.map(g=>{const cards=orders.filter(o=>boardStage(o)===g.key);return `<section class="workcol" data-board-stage="${g.key}" aria-label="${g.title}"><div class="workcol-head"><div class="board-column-title"><h2>${g.title}</h2><span class="board-count">${cards.length}</span></div><p>${g.caption}</p></div><div class="board-cards">${cards.map(o=>{const l=getLead(o.leadId),need=Math.max(0,total(o)-(o.paid||0));return `<article class="workcard" draggable="true" data-drag-order="${esc(o.id)}" aria-label="Заказ номер ${esc(o.id)}. ${esc(l?.name||'Клиент')}. Можно перенести в другой этап."><div class="wc-top"><strong>#${esc(o.id)}</strong><span class="board-grip" title="Перетащите карточку" aria-hidden="true">⠿</span>${tag(o.status,orderStatuses[o.status])}</div><h3>${esc(l?.name||'Клиент')}</h3><p>${esc(o.items.map(i=>i.name+' ×'+i.qty).join(', '))}</p><div class="worktags">${o.printType!=='Без нанесения'?`<span class="tag ${(o.mockupStatus||'not_sent')==='approved'?'green':'yellow'}">${esc(MOCKUP_STAGES[o.mockupStatus||'not_sent'])}</span>`:'<span class="tag">Без печати</span>'}<span class="tag">${esc(PRODUCTION_STAGES[o.productionStage||'not_started'])}</span></div>${safeAttachments(o.attachments).length?`<span class="file-count">📎 ${safeAttachments(o.attachments).length} влож.</span>`:''}<div class="wc-stats"><span>Срок: <b>${date(o.deadline)}</b></span><span>Доплата: <b>${fmt(need)}</b></span></div><label class="move-label" for="move-${esc(o.id)}">Переместить в этап</label><select class="board-move" id="move-${esc(o.id)}" data-move-order="${esc(o.id)}" aria-label="Переместить заказ ${esc(o.id)} в этап">${BOARD_STAGES.map(s=>`<option value="${s.key}" ${s.key===g.key?'selected':''}>${s.title.replace(/^\d+ \/ /,'')}</option>`).join('')}</select><button class="btn outline sm" data-edit-order="${esc(o.id)}">Открыть заказ ↗</button></article>`}).join('')||'<div class="empty board-empty">Пока нет заказов</div>'}</div><div class="board-drop-hint" aria-hidden="true">↓ Отпусти, чтобы перенести</div></section>`}).join('')}</div>`;
}
function quoteValues(){const f=$('#quoteForm');if(!f)return null;const values={product:$('.q-product',f).value,qty:Math.max(1,Number($('.q-qty',f).value)||1),base:Math.max(0,Number($('.q-base',f).value)||0),print:Math.max(0,Number($('.q-print',f).value)||0),setup:Math.max(0,Number($('.q-setup',f).value)||0),discount:Math.min(100,Math.max(0,Number($('.q-discount',f).value)||0)),tech:$('.q-tech',f).value};values.gross=(values.base+values.print)*values.qty+values.setup;values.price=Math.round(values.gross*(1-values.discount/100));values.unit=Math.round(values.price/values.qty);return values}
function updateQuote(){const v=quoteValues();if(!v)return;$('#quoteTotal').textContent=fmt(v.price);$('#quoteUnit').textContent=fmt(v.unit)+' / шт';$('#quoteInfo').textContent=`Изделия ${fmt(v.base*v.qty)} · нанесение ${fmt(v.print*v.qty)} · подготовка ${fmt(v.setup)} · скидка ${v.discount}%`;}
function calculatorView(){return heading('SHMOT312 / просчёт','Калькулятор тиража','Быстро считай предложение по изделиям и нанесению — без обещаний неподтверждённых цен и сроков.',`<button class="btn outline" data-page="orders">Перейти к заказам ↗</button>`)+
 `<div class="two-col"><section class="panel"><h2>Новый расчёт</h2><div class="notice warn" style="margin-top:12px">Введите <b>подтверждённые компанией цены</b>. Значения здесь только для демонстрации.</div><form id="quoteForm"><div class="grid-two"><div class="form-field"><label>Товар</label><select class="q-product">${db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-field"><label>Технология</label><select class="q-tech">${opts({'Без нанесения':'Без нанесения','DTF-печать':'DTF-печать','Термотрансфер':'Термотрансфер','Шелкография':'Шелкография','Вышивка':'Вышивка','Другое':'Другое'},'Без нанесения')}</select></div><div class="form-field"><label>Тираж, шт.</label><input class="q-qty" type="number" min="1" max="100000" value="30"></div><div class="form-field"><label>Изделие, сом / шт.</label><input class="q-base" type="number" min="0" value="${db.products[0]?.price||0}"></div><div class="form-field"><label>Нанесение, сом / шт.</label><input class="q-print" type="number" min="0" value="0"></div><div class="form-field"><label>Подготовка макета, сом</label><input class="q-setup" type="number" min="0" value="0"></div><div class="form-field wide"><label>Скидка, %</label><input class="q-discount" type="number" min="0" max="100" value="0"></div></div></form></section><section class="panel"><h2>Коммерческое предложение</h2><p class="subtext" style="margin:12px 0">Расчёт создаётся только в этом окне и не добавляет заказ в базу.</p><div class="quote-result"><small>Стоимость тиража</small><strong id="quoteTotal">0 сом</strong><div id="quoteUnit">0 сом / шт</div></div><p class="subtext" id="quoteInfo"></p><div class="actions" style="margin-top:22px"><button class="btn primary" data-action="copy-quote">⧉ Скопировать предложение</button><button class="btn outline" data-action="new-order">＋ Оформить заказ</button></div><div class="note" style="margin-top:18px">Перед отправкой клиенту подтвердите наличие, технологию, срок и итоговую цену с производством.</div></section></div>`;
}

const ATTACH_DB_NAME='shmot312-nightshift-files-v1';
const ATTACH_STORE='binary';
let attachDbPromise=null, fileDraft=null;
function openAttachDb(){
 if(!('indexedDB' in window))return Promise.reject(new Error('Этот браузер не поддерживает IndexedDB.'));

  req.onerror=()=>reject(req.error||new Error('Не удалось открыть хранилище файлов'));
  req.onblocked=()=>reject(new Error('Файловое хранилище занято другой вкладкой'));

}
async function writeAttachmentOps(add=[],remove=[]){

  tx.onabort=()=>reject(tx.error||new Error('Не удалось сохранить вложения: проверьте свободное место'));
  tx.onerror=()=>{};

}
async function readAttachment(fileId){

  req.onsuccess=()=>resolve(req.result?.blob||null);
  req.onerror=()=>reject(req.error);

}

 if(!confirm('Восстановить базу и вложения из архива? Текущие данные будут заменены. Предварительно сохраните полную копию.'))return;
 const add=all.map(m=>({id:m.id,file:entries.get('files/'+m.id)}));
 const current=[...db.leads,...db.orders].flatMap(x=>safeAttachments(x.attachments).map(m=>m.id));
 await writeAttachmentOps(add,current.filter(x=>!all.some(m=>m.id===x)));
 db=parsed;refresh();toast('База и файлы восстановлены из ZIP');
}

 e.preventDefault();
 e.dataTransfer.dropEffect='move';
 $$('.workcol.is-drop-target').forEach(c=>{if(c!==target)c.classList.remove('is-drop-target')});

 moveOrderToStage(orderId,stage);

 if(t.classList.contains('q-product')){const p=db.products.find(x=>x.id===t.value);if(p)$('#quoteForm .q-base').value=p.price;updateQuote();return}
 if(t.classList.contains('oi-product')){let p=db.products.find(p=>p.id===t.value);if(p)t.closest('.order-line').querySelector('.oi-base').value=p.price;recalcOrder();return}
 if(t.id==='importFile'&&t.files?.[0]){try{const content=await t.files[0].text(),parsed=JSON.parse(content);if(!Array.isArray(parsed.leads)||!Array.isArray(parsed.orders)||!Array.isArray(parsed.products))throw Error('Неподходящий формат');if(!confirm('Заменить текущие данные данными из этого файла?'))return;db=parsed;refresh();toast('JSON восстановлен. Файлы импортируются только из полной копии ZIP')}catch(err){toast('Ошибка импорта: '+err.message)}return}
 });
document.addEventListener('input',e=>{const t=e.target;if(t.id==='leadSearch'){leadQuery=t.value;const ls=db.leads.filter(l=>(leadStatus==='all'||l.status===leadStatus)&&(leadSource==='all'||l.source===leadSource)&&[l.name,l.handle,l.phone,l.category,l.company,l.campaign,l.notes].join(' ').toLowerCase().includes(leadQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('#leadsTable').innerHTML=leadsTable(ls);$('#leadCount').textContent=ls.length+' заявок'}if(t.id==='orderSearch'){orderQuery=t.value;const os=db.orders.filter(o=>(orderStatus==='all'||o.status===orderStatus)&&[o.id,getLead(o.leadId)?.name||'',o.printType,o.notes].join(' ').toLowerCase().includes(orderQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('#ordersTable').innerHTML=ordersTable(os);$('#orderCount').textContent=os.length+' заказов'}if(t.closest('#orderForm'))recalcOrder();if(t.closest('#quoteForm'))updateQuote()});
document.addEventListener('submit',async e=>{
 if(!['leadForm','orderForm','productForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f).entries());
 if(f.id==='leadForm'){const exists=getLead(f.dataset.id);const old=exists||{id:id('L'),createdAt:now()};let l={...old,name:fd.name.trim(),handle:fd.handle.trim().replace(/^@/,''),phone:fd.phone.trim(),source:fd.source,status:fd.status,priority:fd.priority,category:fd.category.trim(),clientType:fd.clientType,company:fd.company.trim(),campaign:fd.campaign.trim(),notes:fd.notes.trim(),nextAction:fd.nextAction.trim(),dueDate:fd.dueDate,lastAt:now()};if(!l.name){toast('Укажите имя клиента');return}try{l.attachments=await persistDraftFileChanges()}catch(err){toast('Файлы не сохранены: '+err.message);return}if(exists)Object.assign(exists,l);else db.leads.unshift(l);closeModal();refresh();toast(exists?'Карточка сохранена':'Заявка добавлена');return}
 if(f.id==='productForm'){const exists=db.products.find(x=>x.id===f.dataset.id);let p={id:exists?.id||id('P'),name:fd.name.trim(),price:Number(fd.price)||0,emoji:fd.emoji.trim()||'📦',desc:fd.desc.trim()};if(!p.name){toast('Укажите название товара');return}if(exists)Object.assign(exists,p);else db.products.push(p);closeModal();refresh();toast('Товар сохранён');return}
 if(f.id==='orderForm'){const items=readItems(),existing=db.orders.find(x=>x.id===f.dataset.id);if(!items.length||items.some(x=>!Number.isInteger(x.qty)||x.qty<1||x.base<0||x.print<0)){toast('Проверьте количество и стоимость позиций');return}const discount=Math.min(100,Math.max(0,Number(fd.discount)||0)),paid=Number(fd.paid)||0;if(paid<0||paid>total({items,discount})){toast('Оплата не может быть отрицательной или превышать сумму заказа');return}let o={id:existing?.id||id('M'),leadId:fd.leadId,items,discount,paid,status:fd.status,printType:fd.printType,mockupStatus:fd.mockupStatus,productionStage:fd.productionStage,mockup:fd.mockup.trim(),deadline:fd.deadline,delivery:fd.delivery,deliveryAddress:fd.deliveryAddress.trim(),tracking:fd.tracking.trim(),notes:fd.notes.trim(),createdAt:existing?.createdAt||now()};try{o.attachments=await persistDraftFileChanges()}catch(err){toast('Файлы не сохранены: '+err.message);return}if(existing)Object.assign(existing,o);else db.orders.unshift(o);const l=getLead(o.leadId);if(l&&o.status==='done'){l.status='done';l.lastAt=now()}closeModal();refresh();toast(existing?'Заказ обновлён':'Заказ создан');return}
 });
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#filePreview')){closeFilePreview();return}if(e.key==='Escape'&&$('#mask'))closeModal()});
$('#clock').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
openPage('dashboard');
</script>
</body>
</html>
