function toast(msg){const node=$('#toast');node.textContent=msg;node.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>node.classList.remove('show'),3000)}
function getLead(id){return db.leads.find(l=>l.id===id)}

function opts(map,val){return Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(v)}</option>`).join('')}
function tag(key,label){return `<span class="tag ${statusColors[key]||'dark'}">${esc(label||statuses[key]||orderStatuses[key]||key)}</span>`}
function source(s){return s==='instagram'?'<span class="tag violet">◎ Instagram</span>':s==='whatsapp'?'<span class="tag green">◉ WhatsApp</span>':'<span class="tag dark">Вручную</span>'}
function fmtTemplate(t,l){const ls=l||db.leads[0];return t.replaceAll('{имя}',ls?.name||'').replaceAll('{товар}',ls?.category||'интересующий товар').replaceAll('{сумма}','[сумма]').replaceAll('{срок}','[дата]')}

function leadsView(){let ls=[...db.leads].filter(l=>(leadStatus==='all'||l.status===leadStatus)&&(leadSource==='all'||l.source===leadSource)&&[l.name,l.handle,l.phone,l.category,l.company,l.campaign,l.notes].join(' ').toLowerCase().includes(leadQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return heading('SHMOT312 / обращения','Заявки и клиенты','Лиды из рекламы, корпоративные клиенты и повторные обращения.',`<button class="btn outline" data-action="export-leads">↓ CSV для Google Таблиц</button><button class="btn primary" data-action="new-lead">＋ Новая заявка</button>`)+`<section class="panel"><div class="filters"><input class="field filter-search" id="leadSearch" placeholder="Поиск по имени, товару, телефону…" value="${esc(leadQuery)}"><select id="leadStatusFilter"><option value="all">Все этапы</option>${opts(statuses,leadStatus)}</select><select id="leadSourceFilter"><option value="all">Все каналы</option>${opts({instagram:'Instagram',whatsapp:'WhatsApp',manual:'Вручную'},leadSource)}</select><span class="mini" id="leadCount">${ls.length} заявок</span></div><div id="leadsTable">${leadsTable(ls)}</div></section>`}
function leadsTable(ls){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Клиент</th><th>Источник</th><th>Интерес / товар</th><th>Этап</th><th>Следующее действие</th><th>Связаться</th><th></th></tr></thead><tbody>${ls.map(l=>`<tr><td><strong>${esc(l.name)}</strong><small>${esc(l.handle?'@'+l.handle:l.phone||'Контакт не указан')}</small></td><td>${source(l.source)}</td><td>${esc(l.category||'—')}${l.company?`<small>🏢 ${esc(l.company)}</small>`:''}</td><td><select data-status-lead="${l.id}" aria-label="Этап клиента">${opts(statuses,l.status)}</select></td><td>${esc(l.nextAction||'—')}<small>${date(l.dueDate)}</small></td><td><div class="quick-links">${contactLinks(l)}</div></td><td><button class="linkish" data-edit-lead="${l.id}">Карточка →</button></td></tr>`).join('')}</tbody></table>${ls.length?'':'<div class="empty">Заявок по этим фильтрам нет</div>'}</div>`}
function contactLinks(l){let a=[];let digits=(l.phone||'').replace(/\D/g,'');if(digits)a.push(`<a href="https://wa.me/${digits}" target="_blank" rel="noopener noreferrer">WA ↗</a>`);if(l.handle)a.push(`<a href="https://www.instagram.com/${encodeURIComponent(l.handle.replace('@',''))}/" target="_blank" rel="noopener noreferrer">IG ↗</a>`);return a.join('')||'<span class="mini">—</span>'}
function ordersView(){let orders=[...db.orders].filter(o=>orderStatus==='all'||o.status===orderStatus).filter(o=>[o.id,getLead(o.leadId)?.name||'',o.printType,o.notes].join(' ').toLowerCase().includes(orderQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return heading('SHMOT312 / заказы','Заказы','Тиражи, макеты, оплата, нанесение, сроки и отправка.',`<button class="btn outline" data-action="export-orders">↓ CSV для Google Таблиц</button><button class="btn primary" data-action="new-order">＋ Оформить заказ</button>`)+`<section class="panel"><div class="filters"><input class="field filter-search" id="orderSearch" placeholder="Поиск по номеру, клиенту…" value="${esc(orderQuery)}"><select id="orderStatusFilter"><option value="all">Все этапы</option>${opts(orderStatuses,orderStatus)}</select><span class="mini" id="orderCount">${orders.length} заказов</span></div><div id="ordersTable">${ordersTable(orders)}</div></section><p class="print-note">Переходы между этапами фиксируются вручную. Для автоматической синхронизации с оплатой, перепиской и курьерскими службами понадобятся интеграции.</p>`}

 `<div class="notice warn"><strong>Важно:</strong> этот экран показывает записи, которые вы заполняете вручную. Он не синхронизирован с реальным цехом, и подтверждение сроков требует согласования с производством.</div>`+

function itemRow(item={}){const p=db.products.find(p=>p.id===item.productId)||db.products[0]||{id:'',name:'',price:0};const x={productId:p.id,name:p.name,size:'',color:'',qty:1,base:p.price,print:0,...item};return `<div class="order-line"><div class="form-field"><label>Товар</label><select class="oi-product">${db.products.map(t=>`<option value="${t.id}" ${t.id===x.productId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="form-field"><label>Размер</label><input class="oi-size" value="${esc(x.size)}" placeholder="M/разные" maxlength="50"></div><div class="form-field"><label>Цвет</label><input class="oi-color" value="${esc(x.color)}" placeholder="Чёрный" maxlength="70"></div><div class="form-field"><label>Штук</label><input class="oi-qty" type="number" min="1" max="100000" step="1" required value="${Number(x.qty)||1}"></div><div class="form-field"><label>Цена/шт</label><input class="oi-base" type="number" min="0" step="1" value="${Number(x.base)||0}"></div><div class="form-field"><label>Печать/шт</label><input class="oi-print" type="number" min="0" step="1" value="${Number(x.print)||0}"></div><button class="remove" type="button" data-action="remove-item" title="Удалить позицию">×</button></div>`}
function orderModal(orderId){if(!db.leads.length){toast('Сначала добавьте клиента');leadModal();return}if(!db.products.length){toast('Сначала добавьте товар в каталог');openPage('catalog');productModal();return}const o=db.orders.find(o=>o.id===orderId)||{id:'',leadId:db.leads[0].id,items:[{productId:db.products[0].id,name:db.products[0].name,size:'',color:'',qty:1,base:db.products[0].price,print:0}],discount:0,status:'draft',paid:0,printType:'Без нанесения',mockup:'',deadline:'',delivery:'Не выбрано',tracking:'',notes:'',mockupStatus:'not_sent',productionStage:'not_started',deliveryAddress:''};modal(o.id?'Заказ #'+o.id:'Оформление заказа',`<form id="orderForm" data-id="${esc(o.id)}"><div class="grid-two"><div class="form-field"><label>Клиент *</label><select name="leadId" required>${db.leads.map(l=>`<option value="${l.id}" ${l.id===o.leadId?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="form-field"><label>Этап заказа</label><select name="status">${opts(orderStatuses,o.status)}</select></div></div><div class="section-label">Товары и расчёт <span class="muted" style="font-size:11px;font-weight:500">— цены в сомах</span></div><div id="orderItems">${o.items.map(x=>itemRow(x)).join('')}</div><button type="button" class="btn light sm" data-action="add-item">＋ Добавить позицию</button><div class="grid-three" style="margin-top:19px"><div class="form-field"><label>Скидка, %</label><input name="discount" id="orderDiscount" type="number" min="0" max="100" step="1" value="${o.discount||0}"></div><div class="form-field"><label>Уже оплачено, сом</label><input name="paid" type="number" min="0" step="1" value="${o.paid||0}"></div><div class="form-field"><label>Нужен к дате</label><input name="deadline" type="date" value="${esc(o.deadline)}"></div></div><div class="order-total"><div><span style="font-size:11px;color:#b7bec8">Итого к оплате</span><div style="font-size:11px;color:#b7bec8;margin-top:6px" id="qtyLabel">1 позиция</div></div><strong id="totalPrice">0 сом</strong></div><div class="total-help" id="orderBalance">Осталось получить: 0 сом</div><div class="section-label">Печать, производство и логистика</div><div class="grid-two"><div class="form-field"><label>Способ нанесения</label><select name="printType">${opts({'Без нанесения':'Без нанесения','DTF-печать':'DTF-печать','Термотрансфер':'Термотрансфер','Шелкография':'Шелкография','Вышивка':'Вышивка','Другое':'Другое'},o.printType)}</select></div><div class="form-field"><label>Способ доставки</label><select name="delivery">${opts({'Не выбрано':'Не выбрано','Самовывоз':'Самовывоз','Курьер':'Курьер','Доставка':'Доставка','Транспортная компания':'Транспортная компания'},o.delivery)}</select></div><div class="form-field"><label>Согласование макета</label><select name="mockupStatus">${opts({not_sent:'Не отправлен',waiting:'Отправлен / ждём ответ',revision:'Нужны правки',approved:'Утверждён клиентом'},o.mockupStatus||'not_sent')}</select></div><div class="form-field"><label>Состояние производства</label><select name="productionStage">${opts({not_started:'Не передан',queued:'Принят в работу',printing:'Нанесение / изготовление',qc:'Проверка качества',ready:'Готов к отправке'},o.productionStage||'not_started')}</select></div><div class="form-field"><label>Ссылка на макет / файл</label><input name="mockup" value="${esc(o.mockup)}" placeholder="https://…" maxlength="600"></div><div class="form-field"><label>Адрес / город доставки</label><input name="deliveryAddress" value="${esc(o.deliveryAddress||'')}" placeholder="Город, адрес, получатель" maxlength="250"></div><div class="form-field"><label>Трек-номер / доставка</label><input name="tracking" value="${esc(o.tracking)}" placeholder="Код отправки" maxlength="150"></div><div class="form-field wide"><label>ТЗ для производства, согласования и комментарии</label><textarea name="notes" maxlength="3500" placeholder="Позиция логотипа, дата согласования, особенности заказа…">${esc(o.notes)}</textarea></div></div><div class="modal-footer"><div>${o.id?`<button type="button" class="btn danger sm" data-delete-order="${o.id}">Удалить заказ</button>`:''}</div><div class="right"><button type="button" class="btn outline" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Сохранить заказ</button></div></div></form>`,true);recalcOrder()}
function readItems(){return $$('.order-line',$('#orderItems')).map(row=>{const productId=$('.oi-product',row).value,p=db.products.find(p=>p.id===productId);return {productId,name:p?.name||'Товар',size:$('.oi-size',row).value.trim(),color:$('.oi-color',row).value.trim(),qty:Number($('.oi-qty',row).value)||0,base:Number($('.oi-base',row).value)||0,print:Number($('.oi-print',row).value)||0}})}
function recalcOrder(){if(!$('#orderForm'))return;const items=readItems(),d=Number($('#orderDiscount').value)||0,paid=Number($('[name=paid]',$('#orderForm')).value)||0;const t=total({items,discount:d});$('#totalPrice').textContent=fmt(t);$('#qtyLabel').textContent=`${items.length} позиций · ${items.reduce((s,x)=>s+x.qty,0)} шт.`;$('#orderBalance').textContent=`Осталось получить: ${fmt(Math.max(0,t-paid))}${paid>t?' (переплата!)':''}`;}
function productModal(productId){const p=db.products.find(x=>x.id===productId)||{id:'',name:'',emoji:'📦',price:0,desc:''};modal(p.id?'Редактировать товар':'Добавить товар',`<form id="productForm" data-id="${esc(p.id)}"><div class="grid-two"><div class="form-field"><label>Название *</label><input name="name" maxlength="100" required value="${esc(p.name)}" placeholder="Поло / шоппер / худи"></div><div class="form-field"><label>Цена за штуку, сом *</label><input name="price" type="number" min="0" max="10000000" required value="${p.price}"></div><div class="form-field"><label>Эмодзи / иконка</label><input name="emoji" maxlength="5" value="${esc(p.emoji)}" placeholder="📦"></div><div class="form-field"><label>Примечание</label><input name="desc" maxlength="220" value="${esc(p.desc)}" placeholder="Особенности ткани и размеров"></div></div><div class="modal-footer"><div>${p.id&&!db.orders.some(o=>o.items.some(x=>x.productId===p.id))?`<button type="button" class="btn danger sm" data-delete-product="${p.id}">Удалить</button>`:''}</div><div class="right"><button type="button" class="btn outline" data-action="close-modal">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></div></form>`)}
function csv(rows,filename){let content='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""').replace(/[\r\n]+/g,' ')+'"').join(';')).join('\r\n');download(new Blob([content],{type:'text/csv;charset=utf-8'}),filename)}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportLeads(){csv([['ID','Имя','Instagram','WhatsApp','Источник','Тип клиента','Компания','Рекламный источник','Этап','Приоритет','Интерес','Заметки','Следующее действие','Дата задачи','Создана'],...db.leads.map(l=>[l.id,l.name,l.handle,l.phone,l.source,l.clientType||'private',l.company||'',l.campaign||'',statuses[l.status],l.priority,l.category,l.notes,l.nextAction,l.dueDate,l.createdAt])],'shmot312-zayavki.csv');toast('Заявки экспортированы в CSV')}
function exportOrders(){csv([['ID заказа','ID клиента','Клиент','Состав заказа','Количество штук','Стоимость до скидки','Скидка %','Сумма','Оплачено','Остаток','Этап','Способ печати','Согласование макета','Стадия производства','Макет','Срок','Доставка','Адрес доставки','Трек','Примечание','Дата'],...db.orders.map(o=>[o.id,o.leadId,getLead(o.leadId)?.name||'',o.items.map(x=>`${x.name} [${x.size}/${x.color}] ${x.qty}шт * (${x.base}+${x.print})`).join(' | '),o.items.reduce((s,x)=>s+x.qty,0),o.items.reduce((s,x)=>s+(x.base+x.print)*x.qty,0),o.discount,total(o),o.paid,Math.max(0,total(o)-o.paid),orderStatuses[o.status],o.printType,o.mockupStatus||'not_sent',o.productionStage||'not_started',o.mockup,o.deadline,o.delivery,o.deliveryAddress||'',o.tracking,o.notes,o.createdAt])],'shmot312-zakazy.csv');toast('Заказы экспортированы в CSV')}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'shmot312-backup-'+localDay()+'.json');toast('Резервная копия сохранена')}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-10000px';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Текст скопирован — можно вставить в переписку')}
function refresh(){save();openPage(page)}
$('#nav').addEventListener('click',()=>{});
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-page]');if(p){openPage(p.dataset.page);return}
 const el=e.target.closest('[data-edit-lead],[data-edit-order],[data-edit-product]');if(el){if(el.dataset.editLead)leadModal(el.dataset.editLead);if(el.dataset.editOrder)orderModal(el.dataset.editOrder);if(el.dataset.editProduct)productModal(el.dataset.editProduct);return}
 const scr=e.target.closest('[data-script]');if(scr){const i=Number(scr.dataset.script);const l=getLead($('#scriptLead')?.value);copyText(fmtTemplate(scripts[i][1],l));return}
 const del=e.target.closest('[data-delete-lead],[data-delete-order],[data-delete-product]');if(del){if(del.dataset.deleteLead){if(!confirm('Удалить клиента? Это действие нельзя отменить.'))return;db.leads=db.leads.filter(l=>l.id!==del.dataset.deleteLead)}if(del.dataset.deleteOrder){if(!confirm('Удалить заказ без возможности восстановления?'))return;db.orders=db.orders.filter(o=>o.id!==del.dataset.deleteOrder)}if(del.dataset.deleteProduct){if(!confirm('Удалить товар?'))return;db.products=db.products.filter(p=>p.id!==del.dataset.deleteProduct)}closeModal();refresh();toast('Запись удалена');return}
 const a=e.target.closest('[data-action]');if(!a){if(e.target.id==='mask')closeModal();return}switch(a.dataset.action){
 case 'close-modal':closeModal();break;
 case 'new-lead':leadModal();break;
 case 'new-order':orderModal();break;
 case 'new-product':productModal();break;
 case 'add-item':$('#orderItems').insertAdjacentHTML('beforeend',itemRow());recalcOrder();break;
 case 'remove-item':if($$('.order-line',$('#orderItems')).length<=1){toast('В заказе должна быть хотя бы одна позиция');return}a.closest('.order-line').remove();recalcOrder();break;
 case 'export-leads':exportLeads();break;
 case 'export-orders':exportOrders();break;
 case 'backup':backup();break;
 case 'copy-quote':{const v=quoteValues();if(!v)break;const p=db.products.find(x=>x.id===v.product);copyText(`Здравствуйте! Расчёт по заказу:\n${p?.name||'Товар'} — ${v.qty} шт.\nНанесение: ${v.tech}\nСтоимость тиража: ${fmt(v.price)} (${fmt(v.unit)} за единицу).\nСтоимость и сроки подлежат подтверждению с производством.`);break;}
 case 'reset':if(confirm('Удалить текущую базу и восстановить демонстрационные данные? Сначала сохраните резервную копию.')){db=initial();closeModal();refresh();toast('Демо-данные восстановлены')}break;
 }});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.statusLead){const l=getLead(t.dataset.statusLead);if(l){l.status=t.value;l.lastAt=now();refresh();toast('Этап клиента обновлён')}return}
 if(t.dataset.statusOrder){const o=db.orders.find(o=>o.id===t.dataset.statusOrder);if(o){o.status=t.value;refresh();toast('Этап заказа обновлён')}return}
 if(t.id==='leadStatusFilter'){leadStatus=t.value;openPage('leads');return}if(t.id==='leadSourceFilter'){leadSource=t.value;openPage('leads');return}if(t.id==='orderStatusFilter'){orderStatus=t.value;openPage('orders');return}
 if(t.id==='scriptLead'){$$('#content [id^=scriptText]').forEach((p,i)=>{p.textContent=fmtTemplate(scripts[i][1],getLead(t.value))});return}
 if(t.classList.contains('q-product')){const p=db.products.find(x=>x.id===t.value);if(p)$('#quoteForm .q-base').value=p.price;updateQuote();return}
 if(t.classList.contains('oi-product')){let p=db.products.find(p=>p.id===t.value);if(p)t.closest('.order-line').querySelector('.oi-base').value=p.price;recalcOrder();return}
 if(t.id==='importFile'&&t.files?.[0]){try{const content=await t.files[0].text(),parsed=JSON.parse(content);if(!Array.isArray(parsed.leads)||!Array.isArray(parsed.orders)||!Array.isArray(parsed.products))throw Error('Неподходящий формат');if(!confirm('Заменить текущие данные данными из этого файла?'))return;db=parsed;refresh();toast('Резервная копия восстановлена')}catch(err){toast('Ошибка импорта: '+err.message)}return}
 });
document.addEventListener('input',e=>{const t=e.target;if(t.id==='leadSearch'){leadQuery=t.value;const ls=db.leads.filter(l=>(leadStatus==='all'||l.status===leadStatus)&&(leadSource==='all'||l.source===leadSource)&&[l.name,l.handle,l.phone,l.category,l.company,l.campaign,l.notes].join(' ').toLowerCase().includes(leadQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('#leadsTable').innerHTML=leadsTable(ls);$('#leadCount').textContent=ls.length+' заявок'}if(t.id==='orderSearch'){orderQuery=t.value;const os=db.orders.filter(o=>(orderStatus==='all'||o.status===orderStatus)&&[o.id,getLead(o.leadId)?.name||'',o.printType,o.notes].join(' ').toLowerCase().includes(orderQuery.toLowerCase())).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('#ordersTable').innerHTML=ordersTable(os);$('#orderCount').textContent=os.length+' заказов'}if(t.closest('#orderForm'))recalcOrder();if(t.closest('#quoteForm'))updateQuote()});
document.addEventListener('submit',e=>{
 if(!['leadForm','orderForm','productForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f).entries());
 if(f.id==='leadForm'){const exists=getLead(f.dataset.id);const old=exists||{id:id('L'),createdAt:now()};let l={...old,name:fd.name.trim(),handle:fd.handle.trim().replace(/^@/,''),phone:fd.phone.trim(),source:fd.source,status:fd.status,priority:fd.priority,category:fd.category.trim(),clientType:fd.clientType,company:fd.company.trim(),campaign:fd.campaign.trim(),notes:fd.notes.trim(),nextAction:fd.nextAction.trim(),dueDate:fd.dueDate,lastAt:now()};if(!l.name){toast('Укажите имя клиента');return}if(exists)Object.assign(exists,l);else db.leads.unshift(l);closeModal();refresh();toast(exists?'Карточка сохранена':'Заявка добавлена');return}
 if(f.id==='productForm'){const exists=db.products.find(x=>x.id===f.dataset.id);let p={id:exists?.id||id('P'),name:fd.name.trim(),price:Number(fd.price)||0,emoji:fd.emoji.trim()||'📦',desc:fd.desc.trim()};if(!p.name){toast('Укажите название товара');return}if(exists)Object.assign(exists,p);else db.products.push(p);closeModal();refresh();toast('Товар сохранён');return}
 if(f.id==='orderForm'){const items=readItems(),existing=db.orders.find(x=>x.id===f.dataset.id);if(!items.length||items.some(x=>!Number.isInteger(x.qty)||x.qty<1||x.base<0||x.print<0)){toast('Проверьте количество и стоимость позиций');return}const discount=Math.min(100,Math.max(0,Number(fd.discount)||0)),paid=Number(fd.paid)||0;if(paid<0||paid>total({items,discount})){toast('Оплата не может быть отрицательной или превышать сумму заказа');return}let o={id:existing?.id||id('M'),leadId:fd.leadId,items,discount,paid,status:fd.status,printType:fd.printType,mockupStatus:fd.mockupStatus,productionStage:fd.productionStage,mockup:fd.mockup.trim(),deadline:fd.deadline,delivery:fd.delivery,deliveryAddress:fd.deliveryAddress.trim(),tracking:fd.tracking.trim(),notes:fd.notes.trim(),createdAt:existing?.createdAt||now()};if(existing)Object.assign(existing,o);else db.orders.unshift(o);const l=getLead(o.leadId);if(l&&o.status==='done'){l.status='done';l.lastAt=now()}closeModal();refresh();toast(existing?'Заказ обновлён':'Заказ создан');return}
 });
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mask'))closeModal()});
$('#clock').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
openPage('dashboard');
</script>
</body>
</html>
